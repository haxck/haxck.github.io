  // Get the theme toggle input
  const themeToggle = document.querySelector(
    '.theme-switch input[type="checkbox"]',
  );

  // Get the current theme from local storage
  const currentTheme = localStorage.getItem("theme");

  // If the current local storage item can be found
  if (currentTheme) {
    // Set the body data-theme attribute to match the local storage item
    document.documentElement.setAttribute("class", currentTheme);

    // If the current theme is dark, check the theme toggle
    if (currentTheme === "dark") {
      themeToggle.checked = true;
    }
  }

  function switchTheme() {
    if (themeToggle.checked) {
      document.documentElement.classList.add("dark");
      localStorage.setItem("theme", "dark");
    } else {
      document.documentElement.classList.remove("dark");
      localStorage.setItem("theme", "light");
    }
  }

  // Add an event listener to the theme toggle, which will switch the theme
  themeToggle.addEventListener("change", switchTheme, false);
  document.addEventListener("astro:after-swap", switchTheme);
</script>  </li> </ul> </nav> </div> </div> </header>   <main class="lg:max-w-screen-lg m-auto">  <p></p><ul> <li> <h3><time datetime="2023-12-06T00:00:00.000Z"> 2023年12月6日 </time></h3> <p>更换字体为：思源黑体</p> </li> <li> <h3><time datetime="2023-06-05T00:00:00.000Z"> 2023年6月5日 </time></h3> <p>更换字体为：落霞孤鹜</p> </li> <li> <h3><time datetime="2023-06-13T00:00:00.000Z"> 2023年6月13日 </time></h3> <p>添加更新日志</p> </li> </ul>   </main> <footer class="p-8 text-center dark:text-slate-400 text-sm">
